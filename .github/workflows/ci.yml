name: CI — Build & Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-lint:
    name: Build & Lint Check
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: nextjs-app

    env:
      SESSION_SECRET: ${{ secrets.SESSION_SECRET || 'ci-build-hmac-secret-key-32-characters-minimum' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: nextjs-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run build
        run: npm run build

      - name: Run lint (Biome)
        run: npm run lint:biome

      - name: Run type-check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm run test:coverage
